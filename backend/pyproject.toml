[project]
name = "the-debuggers-backend"
version = "1.0.0"
description = "Registration API for The Debuggers coding club"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "email-validator>=2.2,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "resend>=2.5,<3.0",
  "slowapi>=0.1.9,<0.2",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[tool.uv]
package = false
